esphome:
  name: test-sliding-gate

esp8266:
  board: nodemcuv2

external_components:
  - source:
      type: local
      path: ../../../esphome/components
    components:
      - sliding_gate

logger:

cover:
  - platform: sliding_gate
    id: gate
    device_class: gate
    pin_dir_0: D2
    pin_pos_0: D0
    pin_pos_1: D5
    pin_pos_2: D6
    pin_dir_1: D7
    pin_relay: D1
